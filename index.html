<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="포토폴리오, 자기소개서, 이력서, UXUI, 웹디자인">
    <meta name="description" content="사용자의 흐름을 은은하게 밝히고, 디테일은 진중하게 완성하는 디자이너 박은진입니다.">
    <title>포토폴리오 | 박은진</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/12321/12321198.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/var.css">
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/animation.css">
    <script src="./scripts/index.js" defer></script>
    <!--swiper 필수 css cdn 연결-->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <!--swiper 필수 JS cdn 연결-->
    <script src="https://unpkg.com/swiper/swiper-bundle.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <!-- 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 전체 슬라이드 묶음 -->
    <main class="swiper main_slide">
        <!-- 움직이는 대상 -->
        <div class="swiper-wrapper">
            <!-- 개별 슬라이드 -->
            <!-- 1행-인트로 -->
            <div class="swiper-slide intro">
                    <img src="./images/star1.svg" alt="">
                    <img src="./images/star1.svg" alt="">
                    <img src="./images/star2.svg" alt="">
                    <img src="./images/star3.svg" alt="">
                    <img src="./images/scroll.svg" alt="">
            </div><!-- e:intro -->
            <!-- 2행-목차 -->
            <div class="swiper-slide content">
                <p class="deco">
                    <img src="./images/pattern1.svg" alt="">
                    <img src="./images/pattern2.svg" alt="">
                    <img src="./images/pattern3.svg" alt="">
                    <img src="./images/star1.svg" alt="">
                    <img src="./images/star1.svg" alt="">
                    <img src="./images/star1.svg" alt="">
                </p>
                <div class="list">
                    <a href="#introduce" class="introduce_btn"><h1>About Me</h1></a>
                    <a href="#skill" class="skill_btn"><h1>My Skill & Tools</h1></a>
                    <a href="#project" class="project_btn"><h1>Project Portfolio</h1></a>
                </div>
            </div><!-- e:content -->
            <!-- 3행-자기소개 -->
            <div class="swiper-slide" id="introduce">
                <div class="self">
                    <p class="photo"><!-- 증명사진 background-image로 처리 -->
                        <img src="./images/name.svg" alt="">
                    </p>
                    <p class="dsc">사용자의 흐름을 은은하게 밝히고,<br>디테일은 진중하게 완성하는 디자이너 박은진입니다.</p>
                </div>
                <div class="about_me">
                    <div class="top">
                        <h2>About Me</h2>
                        <div class="about">
                            <div class="name">
                                <h3>NAME</h3>
                                <p>박은진/</p>
                            </div>
                        </div>
                    </div>
                    <div class="btm"></div>
                </div>
            </div><!-- e:introduce -->
            <div class="swiper-slide" id="skill"></div>
            <div class="swiper-slide process"></div>
            <div class="swiper-slide" id="project"></div>
            <div class="swiper-slide ts_redesign"></div>
            <div class="swiper-slide"></div>
            <div class="swiper-slide graphic"></div>
            <div class="swiper-slide Finish"></div>
        </div><!-- swiper-wrapper -->
    </main><!-- e:swiper main-slide -->
</body>
</html>
