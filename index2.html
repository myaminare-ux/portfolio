<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="사용자의 흐름을 은은하게 밝히고, 디테일은 진중하게 완성하는 디자이너 박은진입니다.">
    <meta name="keywords" content="포트폴리오, 자기소개서, 이력서, UXUI, 웹디자인">
    <title>포트폴리오 | 박은진</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/12321/12321198.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/var.css">
    <link rel="stylesheet" href="./styles/index2.css">
    <link rel="stylesheet" href="./styles/animation.css">
    <script src="./scripts/index.js" defer></script>
    <script src="./scripts/index_db.js"></script>
    <!--swiper 필수 css cdn 연결-->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <!--swiper 필수 JS cdn 연결-->
    <script src="https://unpkg.com/swiper/swiper-bundle.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <!-- 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="swiper" id="main_slide">
        <div class="swiper-wrapper">
            <!-- 1행-인트로 -->
            <div class="swiper-slide" id="intro">
                <div class="intro_bg">
                    <img class="intro_title" src="./images/intro.jpg" alt="사람과 세상을 잇는 Memori of My Portfolio">
                    <img class="star" src="" alt="">
                    <img class="star" src="" alt="">
                    <img class="scroll" src="" alt="">
                </div><!-- e:intro_bg -->
            </div><!-- e:intro -->
            <!-- ----------------------- 1행 끝 -->
            <!-- 2행-목차 -->
            <div class="swiper-slide" id="content"></div>
            <!-- ----------------------- 2행 끝 -->
            <!-- 3행-자기소개 -->
            <div class="swiper-slide" id="introduce"></div>
            <!-- ----------------------- 3행 끝 -->
            <!-- 4행-스킬&툴 -->
            <div class="swiper-slide" id="skill"></div>
            <!-- ----------------------- 4행 끝 -->
            <!-- 5행-프로세스 -->
            <div class="swiper-slide" id="process"></div>
            <!-- ----------------------- 5행 끝 -->
            <!-- 6행-프로젝트 목차 -->
            <div class="swiper-slide" id="project"></div>
            <!-- ----------------------- 6행 끝 -->
            <!-- 7행-오롤리데이 리디자인 -->
            <div class="swiper-slide" id="lolly_redesign"></div>
            <!-- ----------------------- 7행 끝 -->
            <!-- 8행-TS 트릴리온 리디자인 -->
            <div class="swiper-slide" id="ts_redesign"></div>
            <!-- ----------------------- 8행 끝 -->
            <!-- 9행-UIUX 디자인 -->
            <div class="swiper-slide" id="uiux_design"></div>
            <!-- ----------------------- 9행 끝 -->
            <!-- 10행-상세페이지, 광고 배너 -->
            <div class="swiper-slide" id="graphic"></div>
            <!-- ----------------------- 10행 끝 -->
            <!-- 11행-마무리 -->
            <div class="swiper-slide" id="finish"></div>
            <!-- ----------------------- 11행 끝 -->
        </div><!-- e:swiper-wrapper -->
    </main><!-- e:main_slide -->
</body>
</html>
